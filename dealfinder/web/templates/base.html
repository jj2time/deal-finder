<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Deal Finder{% endblock %}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e2dd; --accent:#1f6f50; --warn:#a14a1a; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:16px; padding:14px 24px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; } header a { color:inherit; text-decoration:none; }
  main { padding:20px 24px; max-width:1400px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; } th, td { padding:7px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; } td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .score { display:inline-block; min-width:34px; text-align:center; padding:2px 6px; border-radius:6px; font-weight:700; background:#e5f4e4; color:var(--accent); }
  .score.mid { background:#f9eeda; color:#8a5a00; } .score.low { background:#f0efec; color:var(--muted); }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; margin:1px 2px 1px 0; border-radius:10px; background:#e7f1fb; color:#1b4f80; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; align-items:end; } .filters label { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:2px; }
  input, select, button { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button, .btn { background:var(--accent); color:#fff; border:0; cursor:pointer; text-decoration:none; padding:7px 12px; border-radius:6px; display:inline-block; }
  .btn.alt { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .chips a { margin-right:4px; } .chips a.on { background:var(--accent); color:#fff; }
  #map { height:340px; border-radius:8px; }
  .muted { color:var(--muted); } .warn { color:var(--warn); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:10px; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:10px; } .stat b { display:block; font-size:18px; }
  footer { padding:16px 24px 30px; color:var(--muted); font-size:12px; text-align:center; }
  .scroll { overflow-x:auto; }
  h3 { margin:0 0 8px; }
  .form { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:12px; margin-top:10px; }
  .form label { display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:600; }
  .form .wide { grid-column:1 / -1; } textarea { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; width:100%; }
  label.check { display:inline-flex; flex-direction:row; align-items:center; gap:6px; font-weight:400; margin-right:14px; }
  .card.ok { background:#e5f4e4; border-color:#bfe0bd; } .card.warn { background:#fbebeb; border-color:#efc9c9; color:var(--warn); }
  .ok-text { color:var(--accent); font-weight:400; }
  .searchbar { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
  .searchbar label, .row label:not(.check) { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); font-weight:600; }
  .searchbar .grow { flex:1 1 220px; } .searchbar .grow input { font-size:17px; padding:9px 10px; }
  button.big { font-size:16px; padding:10px 22px; }
  .row { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:end; margin-top:12px; }
  fieldset.deals { border:1px solid var(--line); border-radius:8px; margin:14px 0 0; padding:8px 12px 12px; }
  fieldset.deals legend { font-weight:600; padding:0 4px; }
  .dealgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:6px 14px; margin-top:6px; }
  .deal { display:flex; gap:8px; align-items:flex-start; padding:6px; border-radius:6px; cursor:pointer; }
  .deal:hover { background:var(--bg); } .deal input { margin-top:3px; }
  .count { display:inline-block; min-width:20px; text-align:center; font-size:11px; padding:0 5px; border-radius:9px; background:#f0efec; color:var(--muted); }
  .small { font-size:12px; }
  button.link { background:none; border:0; color:var(--accent); padding:0; font-size:12px; text-decoration:underline; cursor:pointer; }
  .progress { display:flex; gap:14px; align-items:center; background:#e7f1fb; border-color:#c9def3; }
  .spinner { width:22px; height:22px; border:3px solid #c9def3; border-top-color:#1b4f80; border-radius:50%; animation:spin 0.9s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .resultsbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .thumb { width:64px; height:46px; object-fit:cover; border-radius:4px; float:left; margin-right:10px; }
  ul.plain { margin:0; padding-left:18px; } .tag.on { background:var(--accent); color:#fff; }
  .postgrid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start; }
  @media (max-width:900px) { .postgrid { grid-template-columns:1fr; } }
  header nav { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  @media (max-width:700px) { main { padding:12px; } header { padding:12px; } }
</style>
</head>
<body>
<header><h1><a href="/">Deal Finder</a></h1>{% block header %}{% endblock %}
<form method="post" action="/quit" style="margin:0" onsubmit="return confirm('Stop Deal Finder? Daily scans pause until you open it again.')"><button class="btn alt" title="Stop Deal Finder running in the background">Stop</button></form></header>
<main>{% block content %}{% endblock %}</main>
<footer>Estimates only, not financial advice. Contains HM Land Registry data © Crown copyright and database right {{ year }}. This data is licensed under the Open Government Licence v3.0.</footer>
</body>
</html>
